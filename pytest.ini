[pytest]
# Marqueurs personnalisés. Les déclarer ici évite l'avertissement
# « PytestUnknownMarkWarning » et documente leur usage en un seul endroit.
markers =
    toutes_cameras: ouvre toutes les caméras de la machine, webcam intégrée comprise.
        Exclure avec : pytest -m "not toutes_cameras"
